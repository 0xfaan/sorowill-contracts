name: Spec Export

# Emits the will contract's spec (function signatures + Will/Beneficiary/
# Guardian/WillStatus/WillError types) as a versioned JSON artifact so
# sorowill-sdk can diff its hand-written TypeScript/XDR bindings against
# the deployed contract's real interface. See spec/README.md.

on:
  push:
    branches: [main]
    paths:
      - "contracts/will/**"
      - "spec/**"
      - "scripts/export-spec.sh"
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  export-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --features opt

      - name: Export contract spec JSON
        run: ./scripts/export-spec.sh

      - name: Upload spec as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: will-contract-spec
          path: spec/will-v*.json

      - name: Attach spec to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: spec/will-v*.json
