name: Mutation testing (cargo-mutants)

# Non-blocking by design: cargo-mutants re-compiles and re-runs the test
# suite once per mutation, so a full run over even a modestly sized crate
# can take a long time. This starts as informational (failure does not
# block merges) until we've triaged a baseline set of survivors and trust
# the signal enough to gate on it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Advisory only for now — see comment above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run cargo mutants against the will contract crate
        run: |
          cargo mutants \
            --package will \
            --no-shuffle \
            --timeout-multiplier 3 \
            --output mutants-report

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants-report
