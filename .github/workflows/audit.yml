name: Security Audit

# Scans the contracts crate's dependency tree (Cargo.lock) for known RUSTSEC
# advisories. Runs on every PR so a newly introduced vulnerable dependency is
# caught before merge, and daily so an advisory published against an
# *existing* dependency in Cargo.lock is still caught even when no PR is
# open. See CONTRIBUTING.md#handling-a-flagged-security-advisory for the
# process to follow when this job fails.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-v1

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --file Cargo.lock --deny warnings
