name: Fuzz

# Deliberately not run on pull requests. The proptest suite in
# `contracts/will/src/fuzz_test.rs` covers the same invariants on every PR via
# the Test workflow; this job is the deep, coverage-guided pass, which needs a
# nightly toolchain and minutes rather than seconds.
on:
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds to run each fuzz target for
        required: false
        default: "300"
  schedule:
    # 04:17 UTC daily.
    - cron: "17 4 * * *"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [create_will, update_beneficiaries]
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '300' }} \
            -max_len=512

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
